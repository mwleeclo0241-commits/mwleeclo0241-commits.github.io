---
layout: default
title: Category
permalink: /category/
---

<h1 class="page-heading">Category</h1>
<p class="category-desc">관심 분야별로 글을 6개 카테고리로 나눠 정리합니다.</p>

<div class="category-grid">
  {% for c in site.data.categories %}
    {% assign c_posts = site.categories[c.slug] %}
    <a class="category-card" href="{{ "/category/" | append: c.slug | append: "/" | relative_url }}">
      <span class="category-card-icon">{{ c.icon }}</span>
      <span class="category-card-name">{{ c.name }}</span>
      <span class="category-card-desc">{{ c.desc }}</span>
      <span class="category-card-count">{{ c_posts.size | default: 0 }} posts</span>
    </a>
  {% endfor %}
</div>
